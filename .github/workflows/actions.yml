name: Build and Deploy to YC

on:
   push:
      branches: [main]

jobs:
   build-and-push:
      runs-on: ubuntu-latest
      steps:
         - name: Checkout code
           uses: actions/checkout@v4

         - name: Set up Docker Buildx
           uses: docker/setup-buildx-action@v3

         - name: Login to Yandex Cloud Registry
           uses: docker/login-action@v3
           with:
              registry: registry.yandexcloud.net
              username: api_key
              password: ${{ secrets.YC_API_KEY  }}

         - name: Build and push Docker image
           uses: docker/build-push-action@v6
           env:
              BUILD_ENV_DATA: ${{ secrets.ENV_FILE }}
           with:
              context: .
              file: ./Dockerfile
              push: true
              provenance: false
              sbom: false
              tags: |
                 registry.yandexcloud.net/${{secrets.YC_REGISTRY_ID}}/marbelous:latest
                 registry.yandexcloud.net/${{secrets.YC_REGISTRY_ID}}/marbelous:${{ github.sha }}
              secret-envs: |
                 build_env=BUILD_ENV_DATA
