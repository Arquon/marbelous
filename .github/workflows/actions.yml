name: Build and Deploy to YC

on:
   push:
      branches: [main]

jobs:
   build-and-push:
      runs-on: ubuntu-latest
      steps:
         - name: Checkout code
           uses: actions/checkout@v4

         - name: Set up Docker Buildx
           uses: docker/setup-buildx-action@v3

         - name: Login to Yandex Container Registry
           uses: docker/login-action@v3
           with:
              registry: cr.yandex
              username: json_key
              password: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

         - name: Build and push Docker image
           uses: docker/build-push-action@v6
           env:
              BUILD_ENV_DATA: ${{ secrets.ENV_FILE }}
           with:
              context: .
              file: ./Dockerfile
              push: true
              provenance: false
              sbom: false
              tags: |
                 cr.yandex/${{secrets.YC_REGISTRY_ID}}/marbelous:latest
                 cr.yandex/${{secrets.YC_REGISTRY_ID}}/marbelous:${{ github.sha }}
              secret-envs: |
                 build_env=BUILD_ENV_DATA
         - name: Deploy to Yandex Serverless Containers
           uses: yc-actions/yc-sls-container-deploy@v3
           with:
              yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
              folder-id: ${{secrets.YC_FOLDER_ID}}
              container-name: ${{secrets.YC_CONTAINER_NAME}}
              revision-service-account-id: ${{ secrets.YC_SERVICE_RUNNER_ID }}
              revision-image-url: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/marbelous:${{ github.sha }}
              revision-cores: 1
              revision-memory: 512Mb
              revision-concurrency: 4
              revision-execution-timeout: 30s
              revision-container-port: 8080
              revision-environment: |
                 REVALIDATE_SECRET=${{ secrets.REVALIDATE_SECRET }}
